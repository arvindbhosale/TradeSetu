[package]
name = "tradesetu-desktop"
version = "0.1.0"
description = "TradeSetu desktop app"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "tradesetu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
