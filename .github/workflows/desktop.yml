name: Desktop app

# Builds the native app (Tauri window + the desk backend frozen with
# PyInstaller) for macOS (Apple Silicon and Intel), Windows and Linux, plus an
# Android APK that opens a hosted desk.
#
# Merging to main never publishes. Pull requests that touch the app build the
# installers as workflow artifacts only. A release is published only when you
# ask for one, in either of two ways:
#   1. Actions > Desktop app > Run workflow, branch main, type a version
#      (for example 0.8.0). Leave it empty to use the version in
#      desktop/app/src-tauri/tauri.conf.json.
#   2. Push a tag desktop-v<version> (for example desktop-v0.8.0).
# Either way the release is tagged desktop-v<version>; a version that is
# already released is refused. Run workflow on another branch builds only.

on:
  pull_request:
    paths: ["desktop/**", "desk/app.py", "pyproject.toml", ".github/workflows/desktop.yml"]
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.8.0 (empty: the version in tauri.conf.json)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  version:
    name: decide version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['version'])")
          case "$EVENT" in
            push)              version="${REF_NAME#desktop-v}"; publish=true ;;
            workflow_dispatch) version="${INPUT_VERSION:-$file}"; version="${version#v}"
                               [ "$REF" = "refs/heads/main" ] && publish=true || publish=false ;;
            *)                 version="$file"; publish=false ;;
          esac
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version '$version' is not like 0.8.0"; exit 1; }
          if [ "$publish" = true ] && gh release view "desktop-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release desktop-v$version already exists. Pick a higher version."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$publish" = true ] && \
             git ls-remote --exit-code --tags origin "refs/tags/desktop-v$version" >/dev/null 2>&1; then
            echo "::error::Tag desktop-v$version already exists. Pick a higher version."
            exit 1
          fi
          echo "Version $version, publish=$publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            slug: macOS-AppleSilicon
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
            slug: macOS-Intel
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            slug: Windows-x64
          - name: Linux
            # The oldest supported runner, so the AppImage and .deb run on older distributions too.
            os: ubuntu-22.04
            bundles: appimage,deb
            slug: Linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json and tauri.conf.json agree on the version
        run: |
          a=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['version'])")
          b=$(python3 -c "import json; print(json.load(open('desktop/app/package.json'))['version'])")
          [ "$a" = "$b" ] || { echo "tauri.conf.json says $a, package.json says $b"; exit 1; }

      - name: Set the app version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          for p in ("desktop/app/src-tauri/tauri.conf.json", "desktop/app/package.json"):
              with open(p, encoding="utf-8") as f:
                  d = json.load(f)
              d["version"] = v
              with open(p, "w", encoding="utf-8") as f:
                  f.write(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri -> target

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Freeze the desk backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[desk]" "pyinstaller==$PYINSTALLER_VERSION"
          pyinstaller desktop/backend/desk-backend.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke-test the backend
        run: |
          exe=dist/desk-backend/desk-backend
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          python desktop/backend/smoke.py "$exe"

      - name: Build the app and installers
        working-directory: desktop/app
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect installers
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['version'])")
          name=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['productName'].replace(' ', ''))")
          bundle=desktop/app/src-tauri/target/release/bundle
          mkdir -p out
          shopt -s nullglob
          for f in $bundle/dmg/*.dmg;           do cp "$f" "out/$name-$version-${{ matrix.slug }}.dmg"; done
          for f in $bundle/nsis/*.exe;          do cp "$f" "out/$name-$version-${{ matrix.slug }}-Setup.exe"; done
          for f in $bundle/msi/*.msi;           do cp "$f" "out/$name-$version-${{ matrix.slug }}.msi"; done
          for f in $bundle/appimage/*.AppImage; do cp "$f" "out/$name-$version-${{ matrix.slug }}.AppImage"; done
          for f in $bundle/deb/*.deb;           do cp "$f" "out/$name-$version-${{ matrix.slug }}.deb"; done
          ls -la out
          [ -n "$(ls out)" ] || { echo "no installers were built"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.slug }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set the app version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          for p in ("desktop/app/src-tauri/tauri.conf.json", "desktop/app/package.json"):
              with open(p, encoding="utf-8") as f:
                  d = json.load(f)
              d["version"] = v
              with open(p, "w", encoding="utf-8") as f:
                  f.write(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri -> target
          key: android

      - name: Build the APK
        working-directory: desktop/app
        run: |
          # The runner image ships the Android SDK, NDK and JDK 17.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android init --ci
          npx tauri icon ../../desk/static/icon-512.png
          npx tauri android build --apk --target aarch64 armv7 x86_64 --ci

      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['version'])")
          name=$(python3 -c "import json; print(json.load(open('desktop/app/src-tauri/tauri.conf.json'))['productName'].replace(' ', ''))")
          apk=$(find desktop/app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$apk" ] || { echo "no release APK was built"; exit 1; }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            alias="${KEY_ALIAS:-upload}"
          else
            # No signing key in the repository secrets: sign with a key made for this build.
            # The APK installs, but the next version signed with another key must replace it by uninstall first.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a one-off key"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            alias=build
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$alias" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=$name"
          fi
          mkdir -p out
          "$tools/zipalign" -f -p 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$alias" \
            --out "out/$name-$version-Android.apk" aligned.apk
          "$tools/apksigner" verify --print-certs "out/$name-$version-Android.apk" | head -3
          rm -f release.jks aligned.apk
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: installers-Android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: [version, build, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag
        run: echo "TAG=desktop-v${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cd ..
          version="${TAG#desktop-v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          link() { f=$(cd out && ls $1 2>/dev/null | head -1); [ -n "$f" ] && echo "[$f]($base/$f)" || echo "not built"; }
          cat > notes.md <<EOF
          Native desktop app for macOS, Windows and Linux. The desk runs on your own computer: no server, no browser tab.

          ## Download

          | Computer | Installer |
          |---|---|
          | Mac with Apple chip (M1 to M4) | $(link '*macOS-AppleSilicon.dmg') |
          | Mac with Intel chip | $(link '*macOS-Intel.dmg') |
          | Windows 10 / 11 (installer, recommended) | $(link '*Windows-x64-Setup.exe') |
          | Windows 10 / 11 (MSI, for managed PCs) | $(link '*Windows-x64.msi') |
          | Linux, any distribution (AppImage) | $(link '*Linux-x86_64.AppImage') |
          | Ubuntu / Debian (.deb) | $(link '*Linux-x86_64.deb') |
          | Android 8+ phone or tablet (APK) | $(link '*Android.apk') |

          Checksums: [SHA256SUMS.txt]($base/SHA256SUMS.txt)

          ## First start: security warnings

          These builds are not signed with an Apple or Microsoft certificate yet, so your computer warns before the first start.

          - **Mac**: open the .dmg and drag TradeSetu to Applications. Open it once; when macOS says it cannot verify the developer, go to System Settings > Privacy & Security and press **Open Anyway**. If macOS says the app "is damaged", run this once in Terminal: \`xattr -cr /Applications/TradeSetu.app\`
          - **Windows**: if SmartScreen shows "Windows protected your PC", press **More info** then **Run anyway**.
          - **Android**: open the APK on the phone and allow "Install unknown apps" for your browser or file manager when asked. The Android app opens your hosted desk (enter its https address on first start); a phone cannot run the desk itself. The existing website / PWA keeps working as before.
          - **Linux AppImage**: \`chmod +x TradeSetu-*.AppImage\` then run it. Needs WebKitGTK 4.1 (present on Ubuntu 22.04+, Fedora 36+, Debian 12+).

          ## How it runs

          - **On this computer (default)**: the desk starts in the background and closes with the window. Settings, API keys, paper book and algos are kept in \`~/.tradingagents/desk\` (the same place as a pip install). NSE and BSE requests come from your own internet connection, not a cloud server.
          - **My server**: Desk menu > Connection settings, then enter the address of a desk you host (Dokploy, VPS).
          - **Kite**: Zerodha's hosted Kite server needs Node.js installed on this computer for its sign-in. To place live orders, point the MCP setting at your own kite-mcp-server; orders then leave from that server's IP, which is the one to whitelist with Zerodha.
          - Algos run only while the app is open.
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: Publish
        run: |
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "TradeSetu Desktop ${TAG#desktop-v}" \
            --notes-file notes.md --repo "$GITHUB_REPOSITORY"
